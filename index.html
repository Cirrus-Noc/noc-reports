<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cirrus · Report Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0A0F1C;
            color: #E7ECF5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #101828;
            border: 1px solid #1E293F;
            border-radius: 20px;
            padding: 48px;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #2FD4C4;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #8B96AC;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .upload-zone {
            border: 3px dashed #1E293F;
            border-radius: 16px;
            padding: 48px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: #2FD4C4;
            background: rgba(47, 212, 196, 0.05);
        }
        .upload-zone .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
        .upload-zone p {
            color: #8B96AC;
            font-size: 14px;
        }
        .upload-zone .supported {
            font-size: 12px;
            color: #5B677E;
            margin-top: 12px;
            font-family: monospace;
        }
        #fileInput {
            display: none;
        }
        .file-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 16px 0;
            min-height: 40px;
        }
        .file-badge {
            background: #141E33;
            border: 1px solid #1E293F;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
        }
        .file-badge .remove {
            color: #F0684F;
            cursor: pointer;
            font-weight: bold;
        }
        .file-badge .remove:hover {
            color: #ff7a6a;
        }
        .status {
            font-size: 13px;
            color: #8B96AC;
            margin: 12px 0;
            min-height: 24px;
        }
        .status.success {
            color: #33D17A;
        }
        .status.error {
            color: #F0684F;
        }
        .btn {
            background: #2FD4C4;
            color: #06110F;
            border: none;
            border-radius: 10px;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn:hover {
            background: #3DE8D6;
            transform: scale(1.01);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn.secondary {
            background: #1E293F;
            color: #E7ECF5;
            margin-top: 10px;
        }
        .btn.secondary:hover {
            background: #2a3a55;
        }
        .progress {
            width: 100%;
            height: 4px;
            background: #1E293F;
            border-radius: 2px;
            margin: 16px 0;
            overflow: hidden;
            display: none;
        }
        .progress.active {
            display: block;
        }
        .progress .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2FD4C4, #4C8DFF);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #5B677E;
            border-top: 1px solid #1E293F;
            padding-top: 20px;
        }
        .footer a {
            color: #2FD4C4;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Cirrus</div>
        <p class="subtitle">Generate infrastructure reports from Parquet files — entirely in your browser</p>

        <div class="upload-zone" id="uploadZone">
            <span class="icon">📁</span>
            <p><strong>Drop your Parquet files here</strong> or click to browse</p>
            <div class="supported">Supports: disk.parquet · cpu_ram.parquet · network.parquet</div>
        </div>

        <input type="file" id="fileInput" multiple accept=".parquet">

        <div class="file-list" id="fileList"></div>

        <div class="status" id="status">Ready to generate report</div>

        <div class="progress" id="progress">
            <div class="bar" id="progressBar"></div>
        </div>

        <button class="btn" id="generateBtn" disabled>📊 Generate Report</button>
        <button class="btn secondary" id="resetBtn" style="display:none;">🔄 Start Over</button>

        <div class="footer">
            All processing happens locally · <a href="#" id="downloadLink" style="display:none;">Download report</a>
        </div>
    </div>

    <!-- Use a different Parquet library that works in browsers -->
    <script src="https://cdn.jsdelivr.net/npm/parquetjs@0.11.2/lib/parquet.min.js"></script>
    <script>
        // ============================================================
        //  STATE
        // ============================================================
        const state = {
            files: {},
            templateHtml: null,
        };

        // ============================================================
        //  DOM REFS
        // ============================================================
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const status = document.getElementById('status');
        const generateBtn = document.getElementById('generateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const downloadLink = document.getElementById('downloadLink');

        console.log('DOM elements loaded');

        // ============================================================
        //  STATUS HELPER
        // ============================================================
        function setStatus(msg, type = '') {
            console.log('Status:', msg, type);
            status.textContent = msg;
            status.className = 'status' + (type ? ' ' + type : '');
        }

        function setProgress(pct) {
            progress.classList.add('active');
            progressBar.style.width = pct + '%';
        }

        function hideProgress() {
            progress.classList.remove('active');
            progressBar.style.width = '0%';
        }

        // ============================================================
        //  PARQUET READER (using parquetjs)
        // ============================================================
        async function readParquetFile(file) {
            console.log('Reading file:', file.name, file.size, 'bytes');
            
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const arrayBuffer = e.target.result;
                        const uint8Array = new Uint8Array(arrayBuffer);
                        
                        // Parse using parquetjs
                        const parquet = await parquetjs.ParquetReader.fromBuffer(uint8Array);
                        const cursor = parquet.getCursor();
                        const records = [];
                        let record = null;
                        
                        while ((record = await cursor.next())) {
                            records.push(record);
                        }
                        
                        await parquet.close();
                        console.log('Read', records.length, 'rows from', file.name);
                        resolve(records);
                    } catch (err) {
                        console.error('Error parsing parquet:', err);
                        reject(err);
                    }
                };
                reader.onerror = function(err) {
                    console.error('FileReader error:', err);
                    reject(err);
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // ============================================================
        //  FILE HANDLING
        // ============================================================
        function getFileType(filename) {
            const name = filename.toLowerCase();
            if (name === 'disk.parquet') return 'disk';
            if (name === 'cpu_ram.parquet') return 'cpu_ram';
            if (name === 'network.parquet') return 'network';
            return null;
        }

        async function handleFiles(files) {
            console.log('handleFiles called with', files.length, 'files');

            for (const file of files) {
                console.log('Processing file:', file.name);
                const type = getFileType(file.name);
                
                if (!type) {
                    setStatus(`Skipping "${file.name}" — not recognized (expected disk.parquet, cpu_ram.parquet, or network.parquet)`, 'error');
                    continue;
                }

                if (state.files[type]) {
                    setStatus(`Already have ${type}.parquet, skipping duplicate`, 'error');
                    continue;
                }

                try {
                    setStatus(`Reading ${file.name}...`, '');
                    const data = await readParquetFile(file);
                    state.files[type] = data;
                    setStatus(`✅ Loaded ${file.name} (${data.length} rows)`, 'success');
                    renderFileList();
                    updateGenerateButton();
                } catch (err) {
                    console.error('Error reading file:', err);
                    setStatus(`❌ Error reading ${file.name}: ${err.message}`, 'error');
                }
            }
        }

        function removeFile(type) {
            console.log('Removing file:', type);
            delete state.files[type];
            renderFileList();
            updateGenerateButton();
            setStatus(`Removed ${type}.parquet`, '');
        }

        function renderFileList() {
            const types = Object.keys(state.files);
            console.log('Rendering file list:', types);
            
            if (types.length === 0) {
                fileList.innerHTML = '';
                return;
            }

            fileList.innerHTML = types.map(type =>
                `<span class="file-badge">
                    ✅ ${type}.parquet
                    <span class="remove" onclick="removeFile('${type}')">×</span>
                </span>`
            ).join('');
        }

        function updateGenerateButton() {
            const hasAny = !!state.files.disk || !!state.files.cpu_ram || !!state.files.network;
            console.log('Update generate button, hasAny:', hasAny, 'template loaded:', !!state.templateHtml);
            
            generateBtn.disabled = !hasAny || !state.templateHtml;
            
            if (hasAny && state.templateHtml) {
                const parts = [];
                if (state.files.disk) parts.push('Disk');
                if (state.files.cpu_ram) parts.push('CPU/RAM');
                if (state.files.network) parts.push('Network');
                generateBtn.textContent = `📊 Generate Report (${parts.join(', ')})`;
            } else if (!state.templateHtml) {
                generateBtn.textContent = '⏳ Loading template...';
            } else {
                generateBtn.textContent = '📊 Upload Parquet files to start';
            }
        }

        // ============================================================
        //  EVENT HANDLERS
        // ============================================================

        // Click to upload
        uploadZone.addEventListener('click', function(e) {
            console.log('Upload zone clicked');
            fileInput.click();
        });

        // Drag over
        uploadZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('Drag over');
            uploadZone.classList.add('dragover');
        });

        // Drag leave
        uploadZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('Drag leave');
            uploadZone.classList.remove('dragover');
        });

        // Drop
        uploadZone.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('Drop event');
            uploadZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            console.log('Files dropped:', files.length);
            
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        // File input change
        fileInput.addEventListener('change', function(e) {
            console.log('File input change');
            const files = e.target.files;
            console.log('Selected files:', files.length);
            
            if (files.length > 0) {
                handleFiles(files);
            }
            // Reset so user can select the same file again
            fileInput.value = '';
        });

        // Generate button
        generateBtn.addEventListener('click', function() {
            console.log('Generate button clicked');
            generateReport();
        });

        // Reset button
        resetBtn.addEventListener('click', function() {
            console.log('Reset button clicked');
            state.files = {};
            renderFileList();
            updateGenerateButton();
            setStatus('Ready to generate report', '');
            downloadLink.style.display = 'none';
            resetBtn.style.display = 'none';
            generateBtn.disabled = true;
            hideProgress();
        });

        // ============================================================
        //  LOAD TEMPLATE
        // ============================================================

        async function loadTemplate() {
            try {
                console.log('Loading report template...');
                setStatus('Loading template...', '');
                const response = await fetch('report_template.html');
                if (!response.ok) throw new Error('Template not found (HTTP ' + response.status + ')');
                state.templateHtml = await response.text();
                console.log('Template loaded, length:', state.templateHtml.length);
                setStatus('✅ Template loaded', 'success');
                updateGenerateButton();
            } catch (err) {
                console.error('Failed to load template:', err);
                setStatus(`❌ Error loading template: ${err.message}`, 'error');
                generateBtn.textContent = '⚠️ Template missing';
            }
        }

        // ============================================================
        //  DATA PROCESSING (will be added)
        // ============================================================

        function processUtilizationData(rows, metricTypeFilter = null) {
            // Will implement this after testing upload works
            console.log('Processing utilization data...');
            return { rows: rows.length, metricTypeFilter };
        }

        function processNetworkData(rows) {
            // Will implement this after testing upload works
            console.log('Processing network data...');
            return { rows: rows.length };
        }

        async function gzipCompress(str) {
            const bytes = new TextEncoder().encode(str);
            const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
            const compressed = await new Response(stream).arrayBuffer();
            return new Uint8Array(compressed);
        }

        // ============================================================
        //  GENERATE REPORT (simplified for testing)
        // ============================================================

        async function generateReport() {
            console.log('generateReport called with files:', Object.keys(state.files));
            setStatus('Generating report...', '');
            
            try {
                const reportData = {};
                
                // Process each file
                if (state.files.disk) {
                    reportData.disk = processUtilizationData(state.files.disk);
                }
                if (state.files.cpu_ram) {
                    reportData.cpu = processUtilizationData(state.files.cpu_ram, 'CPU');
                    reportData.ram = processUtilizationData(state.files.cpu_ram, 'RAM');
                }
                if (state.files.network) {
                    reportData.network = processNetworkData(state.files.network);
                }

                const activePage = reportData.disk ? 'disk' :
                                  reportData.cpu ? 'cpu' :
                                  reportData.network ? 'network' : 'disk';

                // Compress the data
                const jsonStr = JSON.stringify(reportData);
                const compressed = await gzipCompress(jsonStr);
                const b64 = btoa(String.fromCharCode(...compressed));

                // Inject data into template
                let html = state.templateHtml;
                html = html.replace('const REPORT_DATA_B64 = \'\';', `const REPORT_DATA_B64 = '${b64}';`);
                html = html.replace('const ACTIVE_PAGE = \'\';', `const ACTIVE_PAGE = '${activePage}';`);

                // Download
                const blob = new Blob([html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                downloadLink.href = url;
                downloadLink.download = `cirrus-report-${new Date().toISOString().slice(0, 10)}.html`;
                downloadLink.style.display = 'inline';
                downloadLink.textContent = '📥 Download Full Report';

                setStatus('✅ Report ready! Click the download link below.', 'success');
                resetBtn.style.display = 'block';
                generateBtn.disabled = true;
                hideProgress();
                
            } catch (err) {
                console.error('Error generating report:', err);
                setStatus('❌ Error generating report: ' + err.message, 'error');
            }
        }

        // ============================================================
        //  INIT
        // ============================================================

        async function init() {
            console.log('Initializing...');
            
            // Load template first
            await loadTemplate();
            
            setStatus('Ready — upload your Parquet files', '');
            updateGenerateButton();
            console.log('Initialization complete');
        }

        // Start the app
        init();
    </script>
</body>
</html>
